[project]
name = "civicint"
version = "0.1.0"
description = "Municipal decision document watchdog for Finnish municipalities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "openai>=1.30.0",
    "procrastinate[sqlalchemy]>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "feedparser>=6.0.0",
    "python-slugify>=8.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
civicint = "civicint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicint"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "F821",  # SQLAlchemy uses forward-ref strings in Mapped[] — not actually undefined
    "B008",  # FastAPI Depends() in default args is the standard pattern
    "UP042", # str+enum.Enum needed for SQLAlchemy compatibility with Postgres enums
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
